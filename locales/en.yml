en:
  theme_metadata:
    description: "The Discourse AI Conversations surface for Victorious Christians: landing workspace, conversation history, AI memories, header controls, and the response-status indicator — one component, one switch per module."
    settings:
      vcai_enabled: "Master switch for the whole component. Off removes every module at once."
      vcai_workspace_enabled: "Workspace module: landing page presentation (greeting, status chip, subtitle, composer, starters, ambient field) and active-conversation styling (message cards, docked composer)."
      vcai_workspace_greeting_phrases: "Landing greetings. Use {name} where the member's first name should appear. One phrase per line."
      vcai_workspace_greeting_image_url: "Site-relative or absolute URL for the mark above the greeting."
      vcai_workspace_subtitle: "Supporting line under the landing greeting. Leave blank to hide it."
      vcai_workspace_status_chip_enabled: "Show the status chip above the greeting (live indicator plus the active agent name)."
      vcai_workspace_status_chip_label: "Text shown beside the live indicator in the status chip."
      vcai_workspace_starters_enabled: "Show editable conversation starters below the landing composer. A starter fills the composer but never sends automatically."
      vcai_workspace_starter_count: "Maximum number of starter prompts shown at once."
      vcai_workspace_starter_prompts: "Starter entries in Label::Prompt format. The label remains in the UI; only the prompt is placed in the composer."
      vcai_workspace_dock_agent_selector: "Move the agent selector inside the composer card so upload, agent, and send share one footer row. Turn off to leave it below the composer."
      vcai_workspace_submit_label_enabled: "Add an 'Ask' label and keyboard hint to the composer send button."
      vcai_workspace_ambient_field_enabled: "Draw the ambient dot field and accent bloom behind the landing content."
      vcai_history_enabled: "History module: the conversation rail (persistent on wide screens, a drawer elsewhere) with filter, pinned shelf, row metadata, overflow menu, keyboard navigation and undoable delete."
      vcai_history_width: "Persistent desktop history width in pixels. Titles remain multiline rather than being truncated."
      vcai_history_persistent_min_width: "Viewport width at which history becomes a persistent rail. Below this width the header History control opens a drawer."
      vcai_history_filter_enabled: "Show the local live filter above conversation history."
      vcai_history_row_meta_enabled: "Show the monospace metadata line under each title (message count and age). Data comes from a single cached request; the line is omitted silently if it is unavailable."
      vcai_history_pinned_enabled: "Allow members to pin conversations to a shelf at the top of the history. Pins are stored per member in this browser."
      vcai_history_keyboard_enabled: "Enable keyboard navigation: / focuses the filter, up and down arrows move between conversations, Enter opens, Escape clears."
      vcai_history_undo_window_seconds: "How long the undo toast stays available after deleting a conversation. Set to 0 to delete without an undo offer."
      vcai_history_mobile_hide_chrome_on_scroll: "On phones, slide the New Question button out of the way while scrolling down the history, and bring it back on scroll up."
      vcai_history_mobile_hide_chrome_selectors: "Extra CSS selectors for elements that should hide with the New Question button while scrolling on mobile. Comma separated. Usually blank."
      vcai_history_delete_allowed_groups: "Group names shown the delete control. Use everyone to show it to all members. This only narrows visibility — the server still enforces its own topic-delete permissions. Deletion removes the underlying topic."
      vcai_history_rename_allowed_groups: "Group names shown the rename control. Use everyone to show it to all members. This only narrows visibility — the server still enforces title-edit permissions (ownership, edit window, trust level)."
      vcai_memory_enabled: "Memory module: the AI Memories panel (view, add, delete persistent memories) for the AI routes."
      vcai_memory_width: "Memory panel width in pixels on larger screens."
      vcai_memory_default_open: "Initial panel state before a member has saved their own preference. A remembered or default open state is not auto-applied on screens narrower than 600px."
      vcai_memory_confirm_delete: "Ask for confirmation before deleting a saved memory."
      vcai_header_controls_enabled: "Header controls module: History and Memories as native header icons on the AI routes (History only while the rail is a drawer). Off restores each module's own edge caret."
      vcai_response_status_enabled: "Response-status module: the accessible, tool-aware waiting indicator shown while the AI composes a reply. Keep Discourse AI's own 'AI Working Indicator' component disabled while this is on."
      vcai_response_status_waiting_line: "The single line shown while a reply is streaming and no tool call is running. One line, never rotated: it may claim only that the model is working, because that is all that is known."
      vcai_response_status_tool_labels: "Optional translations for tools whose own wording you do not control, in Exact summary::Friendly label format. Anything not listed now passes through exactly as the server wrote it, so leaving a tool out is safe. Keys must match the bold summary text Discourse AI renders inside a thinking block."
      vcai_response_status_hide_streaming_trailing_dot: "Also hide the small native dot after prose starts streaming. Off leaves Discourse's normal streaming cue intact."
